# Shared settings. Variant files only override what differs.
# No secrets here (tokens live in Kaggle Secrets).
model: Qwen/Qwen3-0.6B
variant: fp16
server:
  dtype: half              # T4 has no bf16
  max_model_len: 2048
  gpu_memory_utilization: 0.90
  max_num_seqs: 64
  port: 8000
workload:
  seed: 42
  num_requests: 200
  prompt_tokens: [100, 900]
  output_tokens: [100, 900]
  online_rates: [1, 2, 4, 8]   # replace after measuring fp16 offline throughput

evaluation:
  backend: hf                  # Week 2 Day 4: switch to vllm for all three variants
  device: cuda
  dtype: float16               # HF / lm-eval name (server.dtype "half" is vLLM's name)
  tasks:
    - wikitext
    - arc_easy
    - arc_challenge
  num_fewshot: 0
  limit: null                  # Full test sets, no limit
  batch_size: 8                # Fixed, never "auto". Keep identical for all variants.
  max_length: 2048             # Perplexity depends on this window; same as max_model_len
  log_samples: true            # Needed for the per-sample records
 
  seeds:                       # Single source for all seeds
    python: 42
    numpy: 42
    torch: 42
    fewshot: 42
 
  report_stderr: true          # Also record the standard error of each metric
 
  metrics:
    wikitext:
      headline: word_perplexity
      report: [word_perplexity]
    arc_easy:
      headline: acc_norm
      report: [acc_norm, acc]
    arc_challenge:
      headline: acc_norm
      report: [acc_norm, acc]
 